<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gerar prévia | devspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f8fafc; color: #1e293b; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p.sub { color: #64748b; margin: 0 0 24px; }
    form { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
    label { display: grid; gap: 5px; font-size: .8125rem; font-weight: 700; text-transform: uppercase; color: #475569; }
    input, select { font: inherit; font-size: 1rem; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; width: 100%; }
    input:focus, select:focus { outline: none; border-color: #2563eb; }
    .resultado { margin-top: 20px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; }
    .resultado[hidden] { display: none; }
    .link { word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; background: #f1f5f9; padding: 10px; border-radius: 8px; margin: 0 0 12px; }
    .acoes { display: flex; flex-wrap: wrap; gap: 10px; }
    button, .botao { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; text-decoration: none; }
    .primario { background: #2563eb; color: #fff; }
    .secundario { background: #e2e8f0; color: #1e293b; }
    .ok { color: #16a34a; font-weight: 700; font-size: .9rem; }
  </style>
</head>
<body>
<main>
  <h1>Gerar prévia de site</h1>
  <p class="sub">Uso interno: monte o link da prévia para mandar na abordagem. A prévia mostra o nome do estabelecimento num site de demonstração.</p>

  <form id="form">
    <label>Nome do estabelecimento
      <input name="nome" maxlength="60" required placeholder="Ex.: Hamburgueria do Zé">
    </label>
    <label>Tipo
      <select name="tipo">
        <option value="hamburgueria">Hamburgueria</option>
        <option value="pizzaria">Pizzaria</option>
        <option value="restaurante" selected>Restaurante</option>
        <option value="cafeteria">Cafeteria</option>
      </select>
    </label>
    <label>Bairro (opcional)
      <input name="bairro" maxlength="40" placeholder="Ex.: Pinheiros">
    </label>
    <label>Cidade
      <input name="cidade" maxlength="40" value="São Paulo">
    </label>
    <button class="primario" type="submit">Gerar link</button>
  </form>

  <section class="resultado" id="resultado" hidden>
    <p class="link" id="link"></p>
    <div class="acoes">
      <button class="primario" type="button" id="copiar">Copiar link</button>
      <a class="botao secundario" id="abrir" href="#" target="_blank" rel="noopener">Abrir prévia</a>
      <span class="ok" id="copiado" hidden>Copiado!</span>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var form = document.getElementById("form");
  var base = new URL("./", window.location.href).href;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var p = new URLSearchParams();
    ["nome", "tipo", "bairro", "cidade"].forEach(function (campo) {
      var v = form.elements[campo].value.replace(/\s+/g, " ").trim();
      if (v && !(campo === "cidade" && v === "São Paulo")) p.set(campo, v);
    });
    var link = base + "?" + p.toString();
    document.getElementById("link").textContent = link;
    document.getElementById("abrir").href = link;
    document.getElementById("copiado").hidden = true;
    document.getElementById("resultado").hidden = false;
  });
  document.getElementById("copiar").addEventListener("click", function () {
    var texto = document.getElementById("link").textContent;
    var ok = function () { document.getElementById("copiado").hidden = false; };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(texto).then(ok, function () { window.prompt("Copie o link:", texto); });
    } else {
      window.prompt("Copie o link:", texto);
    }
  });
})();
</script>
</body>
</html>
